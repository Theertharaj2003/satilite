[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-defence-ai-perception"
version = "0.1.0"
description = "Modular multimodal UAV perception research prototype"
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
include = ["src*"]
